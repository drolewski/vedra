spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vedra
    username: ${POSTGRES_USER:vedra}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text
      chat:
        options:
          model: llama3.2
          temperature: 0.7

application:
  cors:
    allowed-origins:
      - "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Accept-Language
      - Accept
      - Authorization

slack:
  bot-token: ${SLACK_BOT_TOKEN:}
  signing-secret: ${SLACK_SIGNING_SECRET:}
  client-id: ${SLACK_CLIENT_ID:}
  client-secret: ${SLACK_CLIENT_SECRET:}
  redirect-url: ${SLACK_REDIRECT_URL:}
  scopes: ${SLACK_SCOPES:app_mentions:read,channels:history,channels:read,chat:write,commands,groups:history,im:history,mpim:history,team:read,users:read}
  token-encryption-key: ${SLACK_TOKEN_ENCRYPTION_KEY:}

outbox:
  poll-interval: 5000
  cleanup-cron: "0 0 3 * * *"
  cleanup-retention-days: 7

vedra:
  owner-email: ${VEDRA_OWNER_EMAIL:owner@vedra.local}
  rag:
    hybrid-scoring:
      enabled: true
      semantic-weight: 0.65
      quality-weight: 0.25
      freshness-weight: 0.05
      acceptance-weight: 0.05
      freshness-decay-days: 90.0
    quality:
      auto-promote-threshold: 0.8
      auto-promote-min-votes: 5
      demotion-threshold: 0.3
  cache:
    llm:
      enabled: true
      ttl-days: 30
    embedding:
      enabled: true
      ttl-days: 90
