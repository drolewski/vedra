spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vedra
    username: vedra
    password: vedra
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
  ai:
    vectorstore:
      pgvector:
        table-name: "knowledge_entries"
        index-type: HNSW
        distance-type: COSINE
        dimensions: 1536

application:
  cors:
    allowed-origins:
      - "https://vedra.xpp"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Accept-Language
      - Accept
      - Authorization
  multi-tenant:
    enabled: true
