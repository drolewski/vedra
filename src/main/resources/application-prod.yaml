spring:
  ai:
    vectorstore:
      pgvector:
        table-name: "knowledge_entries"
        index-type: HNSW
        distance-type: COSINE
        dimensions: 1536

application:
  cors:
    allowed-origins:
      - "https://vedra.xpp"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Accept-Language
      - Accept
      - Authorization