spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vedra
    username: vedra
    password: vedra
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text
      chat:
        options:
          model: llama3.2
          temperature: 0.3
          max-tokens: 500
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: true
        table-name: knowledge_entries

logging:
  level:
    root: DEBUG

server:
  port: 8080

application:
  cors:
    allowed-origins: "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Accept-Language
      - Accept
      - Authorization
  multi-tenant:
    enabled: true

slack:
  bot-token: ${SLACK_BOT_TOKEN}
