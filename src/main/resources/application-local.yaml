spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vedra
    username: vedra
    password: vedra
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    root: DEBUG

server:
  port: 8080

application:
  cors:
    allowed-origins: "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Accept-Language
      - Accept
      - Authorization
  multi-tenant:
    enabled: true
