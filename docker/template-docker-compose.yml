version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vedra-postgres
    restart: always
    environment:
      POSTGRES_USER: [fill]
      POSTGRES_PASSWORD: [fill]
      POSTGRES_DB: vedra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vedra -d vedra"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
